<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica - Bollettone FIFA 2026</title>
    
    <link rel="icon" type="image/png" href="logo-bollettone-fifa26.png">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto 30px auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 0 0 8px 8px;
        }

        .header {
            background-color: #0B1D3A;
            border-bottom: 6px solid #20D489;
            padding: 25px 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 700px;
            margin: 0 auto;
            gap: 20px;
        }

        .logo { width: 85px; height: auto; flex-shrink: 0; }
        .titles { display: flex; flex-direction: column; }
        .header h1 { color: #ffffff; margin: 0; font-size: 26px; font-weight: 800; }
        .header h2 { color: #20D489; margin: 5px 0 0 0; font-size: 22px; font-weight: 600; }

        /* AREA NAVIGAZIONE UNIFICATA */
        .nav-area {
            padding: 20px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .top-buttons, .view-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .btn-nav {
            background-color: #0B1D3A;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
            width: 48%;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }

        .btn-nav:hover { background-color: #1a365d; }

        /* Stile specifico per i bottoni view (Fase/Bonus) */
        .btn-view {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        
        .btn-view.active {
            background-color: #20D489;
            color: #0B1D3A;
        }

        /* Tabella */
        .table-wrapper { overflow-x: auto; padding: 15px 20px 30px 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: #0B1D3A; padding: 16px 10px; font-size: 15px; font-weight: 800; border-bottom: 2px solid #0B1D3A; text-align: center; }
        td { padding: 16px 10px; border-bottom: 1px solid #e0e4e8; font-size: 16px; font-weight: 600; text-align: center; color: #2c3e50; }
        td:nth-child(2) { text-align: left; color: #0B1D3A; }
        td:nth-child(3) { font-weight: 800; color: #0B1D3A; }
     
        tr:nth-child(1) td { background-color: rgba(32, 212, 137, 0.15); } 
        tr:nth-child(2) td { background-color: rgba(32, 212, 137, 0.10); } 
        tr:nth-child(3) td { background-color: rgba(32, 212, 137, 0.05); } 

        .footer { text-align: center; padding: 15px; font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; border-top: 1px solid #f0f0f0; }
        .hidden-col { display: none !important; }

        @media (max-width: 480px) {
            .btn-nav { font-size: 12px; }
            th, td { font-size: 13px; padding: 12px 7px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <img src="logo-bollettone-fifa26.png" alt="Logo Bollettone FIFA 2026" class="logo">
            <div class="titles">
                <h1>BOLLETTONE FIFA 2026</h1>
                <h2>Classifica Fase finale</h2>
            </div>
        </div>
    </div>

    <div class="container">
        
        <div class="nav-area">
            <div class="top-buttons">
                <a href="pronostici.html" class="btn-nav">Pronostici</a>
                <a href="regolamento.html" class="btn-nav">Regolamento</a>
            </div>
            <div class="view-buttons">
                <button id="btn-fase" class="btn-nav btn-view active" onclick="cambiaGruppo('fase')">Punti per fase</button>
                <button id="btn-bonus" class="btn-nav btn-view" onclick="cambiaGruppo('bonus')">Punti bonus</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="classifica">
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="4" style="text-align:center; padding: 40px;">Caricamento classifica...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer">Dati aggiornati in tempo reale</div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCYfuZRkMNP2cv05ZUiCLnVNhzgJ18knMZ5bK4ffNIzMqH-inqJEtmIBY_tDYX1OjDiMNfV_KXiXFS/pub?gid=1925457345&single=true&output=csv';

        function getColClass(index) {
            if (index <= 2) return 'col-fissa';
            if (index >= 3 && index <= 6) return 'col-bonus';
            return 'col-fase';
        }

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const righe = data.split('\n').filter(row => row.trim() !== '');
                const intestazioni = righe[0].split(',');
                
                let theadHtml = '<tr>';
                intestazioni.forEach((titolo, i) => theadHtml += `<th class="${getColClass(i)}">${titolo.replace(/"/g, '')}</th>`);
                document.getElementById('table-head').innerHTML = theadHtml + '</tr>';

                let tbodyHtml = '';
                for (let i = 1; i < righe.length; i++) {
                    const col = righe[i].split(',');
                    tbodyHtml += '<tr>';
                    col.forEach((c, index) => tbodyHtml += `<td class="${getColClass(index)}">${c.replace(/"/g, '')}</td>`);
                    tbodyHtml += '</tr>';
                }
                document.getElementById('table-body').innerHTML = tbodyHtml;
                cambiaGruppo('fase');
            });

        function cambiaGruppo(gruppo) {
            document.getElementById('btn-fase').classList.toggle('active', gruppo === 'fase');
            document.getElementById('btn-bonus').classList.toggle('active', gruppo === 'bonus');

            document.querySelectorAll('.col-bonus').forEach(el => el.classList.toggle('hidden-col', gruppo !== 'bonus'));
            document.querySelectorAll('.col-fase').forEach(el => el.classList.toggle('hidden-col', gruppo !== 'fase'));
        }
    </script>
</body>
</html>
