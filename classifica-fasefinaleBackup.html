<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica - Bollettone FIFA 2026</title>
    
    <link rel="icon" type="image/png" href="logo-bollettone-fifa26.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1D3A"> 
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto 30px auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 0 0 8px 8px;
        }

        /* Header */
        .header {
            background-color: #0B1D3A;
            border-bottom: 6px solid #20D489;
            padding: 25px 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 700px;
            margin: 0 auto;
            gap: 20px;
        }

        .logo {
            width: 85px;
            height: auto;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            /* ANIMAZIONE LOGO: nome, durata, curva di decelerazione accentuata, mantiene lo stato finale */
            animation: spinOnLoad 2.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .titles {
            display: flex;
            flex-direction: column;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .header h2 {
            color: #20D489;
            margin: 5px 0 0 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* AREA PULSANTI NAVIGAZIONE */
        .nav-area {
            padding: 20px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .top-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

         .btn-top {
            background-color: #0B1D3A;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .btn-top:hover {
            background-color: #1a365d;
        }

        /* PULSANTI SCELTA GRUPPO */
        .group-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-group {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            padding: 0 15px;
            height: 42px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .btn-group:hover { background-color: #cbd5e1; }
        .btn-group.active {
            background-color: #20D489;
            color: #0B1D3A;
            box-shadow: 0 2px 4px rgba(32, 212, 137, 0.3);
        }

        /* Stile Tabella */
        .table-wrapper {
            overflow-x: auto;
            padding: 5px 0px 30px 0px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            color: #0B1D3A;
            padding: 16px 10px;
            font-size: 15px;
            font-weight: 800;
            border-bottom: 2px solid #0B1D3A;
            text-align: center;
        }

        td {
            padding: 16px 10px;
            border-bottom: 1px solid #e0e4e8;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            color: #2c3e50;
        }

        th:first-child, td:first-child { padding-left: 15px; }
        th:last-child, td:last-child { padding-right: 15px; }

        td:nth-child(2) {
            text-align: left;
            color: #0B1D3A;
        }
        
        td:nth-child(3) {
            font-weight: 800;
            color: #0B1D3A; 
        }
     
        tr:nth-child(1) td { background-color: rgba(32, 212, 137, 0.15); } 
        tr:nth-child(2) td { background-color: rgba(32, 212, 137, 0.10); } 
        tr:nth-child(3) td { background-color: rgba(32, 212, 137, 0.05); } 

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #f0f0f0;
        }

        /* --- PODIO FINALE --- */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            padding: 40px 20px 30px 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(to bottom, #ffffff, #f8fafc);
        }

        .podium-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 120px;
        }

        .podium-name {
            font-size: 15px;
            font-weight: 800;
            color: #0B1D3A;
            text-align: center;
            margin-bottom: 10px;
            word-wrap: break-word;
            opacity: 0;
            animation: fadeInAfter 0.4s ease-out 1s forwards; /* Appare dopo 1 secondo */
        }

        .podium-block {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 15px;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
            color: white;
            font-weight: 800;
            font-size: 28px;
            transform-origin: bottom; /* Mantiene la base ancorata in basso */
            transform: scaleY(0);     /* Parte completamente schiacciato */
            animation: expandUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; /* Sale in 1 secondo */
        }

        
      

        .podium-crown {
            font-size: 26px;
            margin-bottom: 5px;

            /* MODIFICA QUESTA RIGA: */
            opacity: 0;
            /* Combina la comparsa (dopo 1s) e l'oscillazione classica (che inizia a 1.4s) */
            animation: fadeInAfter 0.4s ease-out 1s forwards, float 2s ease-in-out 1.4s infinite;
        }


/* COLORI E ALTEZZE GRADINI DESKTOP */
        .step-1 .podium-block { height: 140px; background-color: #FFD700; } /* Oro */
        .step-2 .podium-block { height: 100px; background-color: #C0C0C0; } /* Argento */
        .step-3 .podium-block { height: 70px; background-color: #CD7F32; } /* Bronzo */

        /* Ottimizzazione Mobile */
        @media (max-width: 480px) {
            .header { padding: 10px 15px; }
            .header-content { gap: 12px; }
            .logo { width: 70px; }
            .header h1 { font-size: 18px; letter-spacing: 0; }
            .header h2 { font-size: 15px; }
            
            .btn-top { width: 48%; font-size: 13px; height: 30px; }
            .btn-group { flex-grow: 1; font-size: 13px; padding: 0px 10px; height: 30px; }
            th, td { font-size: 13px; padding: 12px 7px; }

            /* Adattamento Podio per Mobile */
            .podium-container { padding: 30px 10px 20px 10px; gap: 8px; }
            .podium-name { font-size: 12px; }
            
            /* ALTEZZE MOBILE DA AGGIUNGERE */
            .step-1 .podium-block { height: 110px; font-size: 22px; }
            .step-2 .podium-block { height: 75px; font-size: 22px; }
            .step-3 .podium-block { height: 50px; font-size: 22px; }
        } /* <--- QUESTA PARENTESI GRAFFA È FONDAMENTALE */

        /* Classe di utilità per nascondere le colonne non attive */
        .hidden-col {
            display: none !important;
        }

        /* REGOLA DEI KEYFRAMES PER LA ROTAZIONE DEL LOGO */
        @keyframes spinOnLoad {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(720deg); /* 720 gradi = 2 giri completi */
            }
        }

/* ANIMAZIONE: ESPANSIONE GRADINI */
        @keyframes expandUp {
            from {
                transform: scaleY(0);
            }
            to {
                transform: scaleY(1);
            }
        }

        /* ANIMAZIONE: COMPARSA DELICATA NOMI E CORONA */
        @keyframes fadeInAfter {
            from {
                opacity: 0;
                transform: translateY(-5px); /* Un leggero effetto discesa rende l'apparizione più morbida */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


/* ANIMAZIONE: OSCILLAZIONE CORONA */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }


    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <img src="logo-bollettone-fifa26.png" alt="Logo Bollettone FIFA 2026" class="logo">
            <div class="titles">
                <h1>BOLLETTONE FIFA 2026</h1>
                <h2>Classifica Fase finale</h2>
            </div>
        </div>
    </div>

    <div class="container">
        
        <div class="nav-area">
            <div class="top-buttons">
                <a href="pronostici.html" class="btn-top">Pronostici</a>
                <a href="regolamento.html" class="btn-top">Regolamento</a>
            </div>
        
            <div class="group-nav">
                 <button id="btn-fase" class="btn-group active" onclick="cambiaGruppo('fase')">Punti per fase</button>
                 <button id="btn-bonus" class="btn-group" onclick="cambiaGruppo('bonus')">Punti bonus</button>
             </div>
        </div>

        <div class="podium-container">
            <div class="podium-step step-2">
                <div class="podium-name">Nome 2</div>
                <div class="podium-block">2</div>
            </div>
            <div class="podium-step step-1">
                <div class="podium-crown">👑</div>
                <div class="podium-name">nome1</div>
                <div class="podium-block">1</div>
            </div>
            <div class="podium-step step-3">
                <div class="podium-name">Nome3</div>
                <div class="podium-block">3</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="classifica">
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="4" style="text-align:center; padding: 40px;">Caricamento classifica in corso...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            Dati aggiornati in tempo reale
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCYfuZRkMNP2cv05ZUiCLnVNhzgJ18knMZ5bK4ffNIzMqH-inqJEtmIBY_tDYX1OjDiMNfV_KXiXFS/pub?gid=1925457345&single=true&output=csv';

        function getColClass(index) {
            if (index >= 0 && index <= 2) return 'col-fissa';
            if (index >= 3 && index <= 6) return 'col-bonus';
            if (index >= 7) return 'col-fase';
            return '';
        }

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const righe = data.split('\n').filter(row => row.trim() !== '');
                const intestazioni = righe[0].split(',');
                
                let theadHtml = '<tr>';
                intestazioni.forEach((titolo, index) => {
                    const classeColonna = getColClass(index);
                    theadHtml += `<th class="${classeColonna}">${titolo.replace(/"/g, '')}</th>`;
                });
                theadHtml += '</tr>';
                document.getElementById('table-head').innerHTML = theadHtml;

                let tbodyHtml = '';
                for (let i = 1; i < righe.length; i++) {
                    const colonne = righe[i].split(',');
                    tbodyHtml += '<tr>';
                    colonne.forEach((cella, index) => {
                        const classeColonna = getColClass(index);
                        tbodyHtml += `<td class="${classeColonna}">${cella.replace(/"/g, '')}</td>`;
                    });
                    tbodyHtml += '</tr>';
                }
                
                document.getElementById('table-body').innerHTML = tbodyHtml;
                cambiaGruppo('fase');
            })
            .catch(error => {
                console.error('Errore:', error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#e74c3c;">Impossibile caricare la classifica.</td></tr>';
            });

        function cambiaGruppo(gruppo) {
            document.getElementById('btn-fase').classList.remove('active');
            document.getElementById('btn-bonus').classList.remove('active');
            document.getElementById('btn-' + gruppo).classList.add('active');

            const colBonus = document.querySelectorAll('.col-bonus');
            const colFase = document.querySelectorAll('.col-fase');

            if (gruppo === 'fase') {
                colBonus.forEach(el => el.classList.add('hidden-col'));
                colFase.forEach(el => el.classList.remove('hidden-col'));
            } else if (gruppo === 'bonus') {
                colFase.forEach(el => el.classList.add('hidden-col'));
                colBonus.forEach(el => el.classList.remove('hidden-col'));
            }
        }
    </script>
</body>
</html>
