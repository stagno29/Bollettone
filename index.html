 <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Bollettone FIFA 2026</title>
    <!-- Importazione font Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 0; /* Rimosso padding per far aderire l'header ai bordi */
            color: #333;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto 30px auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            /* L'header è fuori dal raggio per dare un effetto a banda piena */
        }

        /* Stile Header come da bozza */
        .header {
            background-color: #0B1D3A; /* Blu notte del logo */
            border-bottom: 6px solid #20D489; /* Verde acqua del logo */
            padding: 25px 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 700px;
            margin: 0 auto;
            gap: 20px;
        }

        .logo {
            width: 85px;
            height: auto;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .titles {
            display: flex;
            flex-direction: column;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .header h2 {
            color: #20D489;
            margin: 5px 0 0 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Stile Tabella Minimale */
        .table-wrapper {
            overflow-x: auto;
            padding: 10px 20px 30px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        /* Prima riga intestazioni: testo grigio scuro, centrato */
        th {
            color: #0B1D3A;
            padding: 16px 10px;
            font-size: 15px;
            font-weight: 800;
            border-bottom: 2px solid #0B1D3A;
            text-align: center;
        }

        /* Celle dati: font pulito, centrate di default */
        td {
            padding: 16px 10px;
            border-bottom: 1px solid #e0e4e8;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            color: #2c3e50;
        }

        /* ECCEZIONE: Seconda colonna allineata a sinistra */
        td:nth-child(2) {
            text-align: left;
            color: #0B1D3A;
        }

        /* Evidenziazione delicata per le prime posizioni */
        tr:nth-child(1) td { background-color: rgba(32, 212, 137, 0.1); }
        tr:nth-child(2) td { background-color: rgba(32, 212, 137, 0.05); }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #f0f0f0;
        }

        /* Ottimizzazione per schermi molto piccoli */
        @media (max-width: 480px) {
            .header-content { flex-direction: column; text-align: center; gap: 15px; }
            .logo { width: 75px; }
            .header h1 { font-size: 22px; }
            .header h2 { font-size: 18px; }
            th, td { font-size: 14px; padding: 12px 5px; }
        }
    </style>
</head>
<body>

    <!-- Header a banda piena -->
    <div class="header">
        <div class="header-content">
            <!-- Richiama l'immagine caricata su GitHub -->
            <img src="logo-bollettone-fifa26.png" alt="Logo Bollettone FIFA 2026" class="logo">
            <div class="titles">
                <h1>BOLLETTONE FIFA 2026</h1>
                <h2>Classifica generale</h2>
            </div>
        </div>
    </div>

    <!-- Contenitore della tabella -->
    <div class="container">
        <div class="table-wrapper">
            <table id="classifica">
                <thead id="table-head">
                    <!-- Intestazioni generate da JS -->
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="4" style="text-align:center; padding: 40px;">Caricamento classifica in corso...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            Dati aggiornati in tempo reale
        </div>
    </div>

    <script>
        // INSERISCI QUI IL TUO LINK CSV PUBBLICO
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCYfuZRkMNP2cv05ZUiCLnVNhzgJ18knMZ5bK4ffNIzMqH-inqJEtmIBY_tDYX1OjDiMNfV_KXiXFS/pub?gid=1925457345&single=true&output=csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const righe = data.split('\n').filter(row => row.trim() !== '');
                const intestazioni = righe[0].split(',');
                
                let theadHtml = '<tr>';
                intestazioni.forEach(titolo => {
                    theadHtml += `<th>${titolo.replace(/"/g, '')}</th>`;
                });
                theadHtml += '</tr>';
                document.getElementById('table-head').innerHTML = theadHtml;

                let tbodyHtml = '';
                for (let i = 1; i < righe.length; i++) {
                    const colonne = righe[i].split(',');
                    tbodyHtml += '<tr>';
                    colonne.forEach(cella => {
                        tbodyHtml += `<td>${cella.replace(/"/g, '')}</td>`;
                    });
                    tbodyHtml += '</tr>';
                }
                
                document.getElementById('table-body').innerHTML = tbodyHtml;
            })
            .catch(error => {
                console.error('Errore:', error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#e74c3c;">Impossibile caricare la classifica.</td></tr>';
            });
    </script>

</body>
</html>
